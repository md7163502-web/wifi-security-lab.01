# Wi-Fi Security Lab — phone-only APK build

This is an educational Android app with a local password-strength checker, an offline simulated demo, and a router-hardening checklist. It does not crack real Wi-Fi passwords.

## Build the APK using only your phone

1. Download and extract this ZIP on your phone.
2. In your mobile browser, sign in to GitHub and create a **new public repository** (for example, `wifi-security-lab`).
3. Upload the extracted project files and folders to the repository. Make sure `.github/workflows/android.yml` is included. GitHub's web uploader may hide dot-folders; if so, use a mobile browser with **Desktop site** enabled.
4. Open the repository's **Actions** tab. If prompted, enable Actions.
5. Select **Build Android APK** and tap **Run workflow** (or wait for the first push build to finish).
6. Open the completed workflow run. Under **Artifacts**, download `WiFi-Security-Lab-APK`.
7. Extract the artifact ZIP on your phone. It contains `app-debug.apk`.
8. Tap the APK to install it. If Android asks, allow your browser or file manager to install unknown apps. Only install APKs you built or trust.

## Notes
- The workflow compiles a debug APK in GitHub's cloud; no computer is required, but a GitHub account and internet access are needed.
- The generated APK is unsigned for Play Store release (Android debug-signed for testing).
- This project is a defensive educational tool, not a real network cracking tool.
